<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>رَصد | RASD</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--teal:#0f9d9a;--dk:#0b6e72;--bg:#eef6f7;--card:#fff;--tx:#17353a;--mut:#6b8a8e;--ok:#2e9e6b;--warn:#e0a21b;--bad:#d9534f;--r:18px}
*{box-sizing:border-box}body{margin:0;font-family:Tajawal,Tahoma,sans-serif;background:var(--bg);color:var(--tx)}
.app{display:flex;min-height:100vh}
aside{width:210px;background:linear-gradient(180deg,var(--dk),var(--teal));color:#fff;padding:20px 12px;flex-shrink:0}
.logo{font-size:22px;font-weight:700;text-align:center;margin-bottom:24px}
aside a{display:block;color:#e3f6f5;padding:11px 14px;border-radius:12px;text-decoration:none;margin-bottom:6px}
aside a.on,aside a:hover{background:rgba(255,255,255,.2);color:#fff}
main{flex:1;padding:20px;min-width:0}
.top{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;margin-bottom:16px}
h1{font-size:20px;margin:0}
button{font-family:inherit;border:0;border-radius:12px;padding:9px 16px;cursor:pointer;background:var(--teal);color:#fff;font-size:14px}
button.sec{background:#dcefef;color:var(--dk)}button.red{background:var(--bad)}
.grid{display:grid;gap:14px}.g4{grid-template-columns:repeat(auto-fit,minmax(160px,1fr))}.g2{grid-template-columns:2fr 1fr}
@media(max-width:900px){.g2{grid-template-columns:1fr}aside{width:70px}aside a{font-size:0}aside a:before{content:"●";font-size:14px}.logo{font-size:12px}}
.card{background:var(--card);border-radius:var(--r);padding:16px;box-shadow:0 2px 10px rgba(15,157,154,.08)}
.stat b{font-size:30px;display:block}.stat span{color:var(--mut);font-size:13px}
table{width:100%;border-collapse:collapse;font-size:14px}th,td{text-align:right;padding:9px 6px;border-bottom:1px solid #e6f0f1}th{color:var(--mut);font-weight:500}
tr.c{cursor:pointer}tr.c:hover{background:#f3fafa}
.b{padding:3px 10px;border-radius:20px;font-size:12px;color:#fff;white-space:nowrap}.b.ok{background:var(--ok)}.b.warn{background:var(--warn)}.b.bad{background:var(--bad)}
.al{padding:9px;border-radius:12px;background:#f3fafa;margin-bottom:8px;font-size:14px}.al small{color:var(--mut);display:block}
input,select,textarea{font-family:inherit;padding:8px;border:1px solid #cfe3e4;border-radius:10px}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}.kv div{background:#f3fafa;border-radius:12px;padding:10px}.kv small{color:var(--mut);display:block}
.flow{display:flex;flex-direction:column;align-items:center;gap:0}.step{background:#fff;border:2px solid var(--teal);border-radius:16px;padding:12px 24px;min-width:260px;text-align:center}
.arr{color:var(--teal);font-size:22px}.note{font-size:12px;color:var(--mut)}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
</style></head><body><div class="app">
<aside><div class="logo">RASD | رَصد</div>
<a href="#home" data-p="home">الرئيسية</a><a href="#alerts" data-p="alerts">التنبيهات</a>
<a href="#history" data-p="history">سجل الحالات</a><a href="#flow" data-p="flow">آلية العمل</a>
<a href="#settings" data-p="settings">الإعدادات</a><a href="#help" data-p="help">المساعدة</a></aside>
<main><div class="top"><h1 id="t"></h1><div>
<span class="b warn">وضع المحاكاة — بيانات تجريبية</span>
<button onclick="demo()">▶ تشغيل المحاكاة</button></div></div><div id="v"></div></main></div>
<script>
const L={NORMAL:['قراءة طبيعية','ok'],REMEASURE:['تحتاج إعادة القياس','warn'],NURSE_REVIEW:['تحتاج مراجعة الممرضة','bad']};
const $=s=>document.querySelector(s);let S={records:[],alerts:[],stats:{},system:{},scenarios:{}},CFG={};
const badge=s=>`<span class="b ${L[s][1]}">${L[s][0]}</span>`;
const tm=t=>t.slice(11,16),dt=t=>t.slice(0,10);
async function load(){S=await (await fetch('/api/state')).json();render()}
async function post(u,b){return (await fetch(u,{method:'POST',body:JSON.stringify(b||{})})).json()}
function demo(){post('/api/simulate',{demo:true});location.hash='home'}
const es=new EventSource('/api/stream');es.onmessage=e=>{load()};
const open=id=>location.hash='case/'+id;
function rows(list,full){return `<table><tr><th>الطالب</th><th>الوقت</th><th>الحرارة</th><th>النبض</th><th>الحالة</th>${full?'<th>الإجراء</th><th>المتابعة</th>':''}</tr>`+
list.map(r=>`<tr class="c" onclick="open('${r.id}')"><td>${r.studentId}</td><td>${tm(r.timestamp)}</td><td>${r.skinTemperature??'—'}</td><td>${r.heartRate??'—'}</td><td>${badge(r.status)}</td>${full?`<td>${r.action}</td><td>${r.followUp}</td>`:''}</tr>`).join('')+'</table>'}
function chart(){const d=S.records.slice(-20);if(d.length<2)return'<p class="note">شغّل المحاكاة لعرض الرسم البياني</p>';
const W=520,H=170,x=i=>10+i*(W-20)/(d.length-1);
const line=(k,lo,hi,c)=>{const p=d.map((r,i)=>r[k]==null?null:`${x(i)},${H-10-(r[k]-lo)/(hi-lo)*(H-20)}`).filter(Boolean).join(' ');return`<polyline fill="none" stroke="${c}" stroke-width="2.5" points="${p}"/>`};
return`<svg viewBox="0 0 ${W} ${H}" width="100%">${line('skinTemperature',32,40,'#e0a21b')}${line('heartRate',50,140,'#0f9d9a')}</svg><span class="note"><b style="color:#e0a21b">━</b> حرارة سطح الجلد &nbsp; <b style="color:#0f9d9a">━</b> معدل النبض</span>`}
const pages={
home(){const s=S.stats,a=S.records.filter(r=>r.status!='NORMAL').slice(-5).reverse();
return`<div class="grid g4">${[['إجمالي الطلاب',s.total],['قراءات طبيعية',s.normal],['حالات تحتاج مراجعة',s.review+s.remeasure],['تنبيهات عاجلة',s.urgent]].map(x=>`<div class="card stat"><b>${x[1]??0}</b><span>${x[0]}</span></div>`).join('')}</div>
<div class="grid g2" style="margin-top:14px"><div class="card"><h3>الحرارة والنبض</h3>${chart()}</div>
<div class="card"><h3>آخر التنبيهات</h3>${a.map(r=>`<div class="al" onclick="open('${r.id}')">الحالة ${r.studentId}: ${L[r.status][0]}<small>${tm(r.timestamp)}</small></div>`).join('')||'<p class="note">لا تنبيهات</p>'}</div></div>
<div class="grid g2" style="margin-top:14px"><div class="card"><h3>جدول الحالات</h3>${rows(S.records.slice(-8).reverse())}</div>
<div class="card"><h3>حالة النظام والحساسات</h3><p>الخادم: ${S.system.server}</p><p>الكاميرا الحرارية: ${S.system.thermal}</p><p>حساس PPG: ${S.system.ppg}</p>
<div class="row">${Object.entries(S.scenarios).map(([k,v])=>`<button class="sec" onclick="post('/api/simulate',{scenario:'${k}'})">${v}</button>`).join('')}</div></div></div>`},
alerts(){const a=S.records.filter(r=>r.status!='NORMAL').reverse();return`<div class="card">${a.map(r=>`<div class="al" onclick="open('${r.id}')"><b>الحالة ${r.studentId} ${r.emergency?'🚨':''}</b> — ${L[r.status][0]}<small>${r.reasons.join(' • ')} | ${tm(r.timestamp)} | الإجراء: ${r.action}</small></div>`).join('')||'<p class="note">لا تنبيهات. أرسل تنبيهات من الإخراج التجريبي.</p>'}</div>`},
history(){const q=($('#q')||{}).value||'',f=($('#f')||{}).value||'';
const l=S.records.filter(r=>r.studentId.includes(q)&&(!f||r.status==f)).reverse();
return`<div class="card"><input id="q" placeholder="بحث برقم الطالب" value="${q}" oninput="render(1)"> <select id="f" onchange="render(1)"><option value="">كل الحالات</option>${Object.keys(L).map(k=>`<option value="${k}" ${f==k?'selected':''}>${L[k][0]}</option>`)}</select>
<div style="overflow-x:auto;margin-top:10px">${rows(l,1)}</div></div>`},
case(id){const r=S.records.find(x=>x.id==id);if(!r)return'<div class="card">غير موجودة</div>';
const sym=r.reportedSymptoms.join(' / ')||'لا يوجد';
return`<div class="card"><h2>رقم الطالب: ${r.studentId} ${r.emergency?'🚨':''}</h2><div class="kv">
<div><small>حالة القراءة</small>${badge(r.status)}</div><div><small>وقت القراءة</small>${dt(r.timestamp)} ${tm(r.timestamp)}</div>
<div><small>حرارة سطح الجلد</small>${r.skinTemperature??'غير متوفرة'} °م</div><div><small>معدل النبض</small>${r.heartRate??'غير متوفر'} ن/د</div>
<div><small>جودة الإشارة</small>${r.signalQuality>=.8?'جيدة':r.signalQuality>=.6?'مقبولة':'ضعيفة'} (${r.signalQuality})</div>
<div><small>الأعراض المبلغ عنها</small>${sym}</div><div><small>سبب التنبيه</small>${r.reasons.join(' • ')}</div>
<div><small>الإجراء المقترح</small>${r.action}</div><div><small>ملاحظات الممرضة</small>${r.notes.join('<br>')||'—'}</div>
<div><small>المصدر (محاكاة)</small>${r.cameraSource} / ${r.sensorSource}</div></div>
<p class="note">هذا النظام لا يشخّص ولا يستبدل الممرضة أو الطبيب.</p>
<div class="row"><button onclick="act('${r.id}','confirm')">تأكيد التقييم</button><button class="sec" onclick="act('${r.id}','remeasure')">إعادة القياس</button>
<button class="sec" onclick="note('${r.id}')">تسجيل ملاحظة</button><button class="red" onclick="act('${r.id}','escalate')">تصعيد الحالة</button>
<button class="sec" onclick="location.hash='home'">رجوع</button></div><p>المتابعة: <b>${r.followUp}</b></p></div>`},
flow(){const s=['جمع القراءات (كاميرا حرارية + PPG + أعراض)','التحقق من جودة البيانات','تحليل البيانات واستخراج المؤشرات','دمج المؤشرات (Multisensor Fusion)','اكتشاف القراءة غير الطبيعية (Rule-based)','تنبيه الممرضة','تقييم الحالة من الممرضة','إبلاغ ولي الأمر عند الحاجة فقط'];
return`<div class="card flow">${s.map((x,i)=>(i?'<div class="arr">↓</div>':'')+`<div class="step">${x}</div>`).join('')}<p class="note">مسار الطوارئ: يتجاوز التحليل ويصل للممرضة مباشرة.</p></div>`},
settings(){return`<div class="card"><h3>العتبات (قيم Prototype وليست حدودًا طبية)</h3><pre dir="ltr">${JSON.stringify(CFG,null,2)}</pre><p class="note">عدّلها من config/thresholds.json ثم أعد تشغيل الخادم. الخصوصية: Student ID فقط، لا صور، بيانات تجريبية.</p></div>`},
help(){return`<div class="card"><p>1) اضغط «تشغيل المحاكاة» أو اختر سيناريو. 2) افتح الحالة من الجدول. 3) اختر إجراء. النظام تجريبي ولا يقوم بقياسات طبية حقيقية دون Hardware فعلي.</p></div>`}};
async function act(id,a){await post('/api/cases/'+id,{action:a});if(a=='remeasure')location.hash='home'}
function note(id){const n=prompt('الملاحظة:');if(n)post('/api/cases/'+id,{action:'note',note:n})}
const T={home:'الرئيسية',alerts:'التنبيهات',history:'سجل الحالات',flow:'آلية عمل رَصد',settings:'الإعدادات',help:'المساعدة',case:'تفاصيل الحالة'};
function render(keep){const [p,id]=(location.hash.slice(1)||'home').split('/');$('#t').textContent=T[p]||'';
document.querySelectorAll('aside a').forEach(a=>a.classList.toggle('on',a.dataset.p==p));
const act=document.activeElement&&document.activeElement.id;$('#v').innerHTML=(pages[p]||pages.home)(id);
if(act){const e=document.getElementById(act);if(e){e.focus();if(e.setSelectionRange)e.setSelectionRange(99,99)}}}
addEventListener('hashchange',render);fetch('/api/config').then(r=>r.json()).then(c=>CFG=c);load();
</script></body></html>
